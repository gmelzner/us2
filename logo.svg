<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Gradient for border using actual brand colors -->
  <defs>
    <linearGradient id="border-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7fb3b3"/>
      <stop offset="50%" style="stop-color:#9333ea"/>
      <stop offset="100%" style="stop-color:#7fb3b3"/>
    </linearGradient>
  </defs>

  <!-- Outer rounded square with gradient -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#border-gradient)"/>

  <!-- Inner white rounded square (offwhite like landing) -->
  <rect x="32" y="32" width="448" height="448" rx="80" ry="80" fill="#f9f9f9"/>

  <!-- US2 Text - exact colors from landing -->
  <text x="256" y="320"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="180"
        font-weight="900"
        text-anchor="middle"
        letter-spacing="-8">
    <tspan fill="#7fb3b3">U</tspan><tspan fill="#9333ea">S</tspan><tspan fill="#7fb3b3">2</tspan>
  </text>
</svg>
